[project]
name = "covau-home-assistant"
version = "0.1.0"
description = "Unofficial CovaU custom integration for Home Assistant"
requires-python = ">=3.12"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "aiohttp>=3.14.5",
    "ruff>=0.14",
]
homeassistant-test = ["homeassistant==2026.10.4"]

[tool.uv.dependency-groups]
homeassistant-test = { requires-python = ">=3.14.2" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
